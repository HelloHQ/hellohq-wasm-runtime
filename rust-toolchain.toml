# Pinned Rust toolchain. DO NOT bump without re-verifying the iOS slice.
#
# WHY 1.95.0: it is the MSRV of wasmtime 48 (48.0.7+ carries the fix for
# GHSA-mghf-wjfp-p5xm), and the oldest toolchain that can build it. 1.94.0 was
# pinned until then, for the reason below.
#
# THE iOS STATICLIB TRAP: rustc >= 1.95 under fat LTO (`[profile.release]
# lto = true`) internalizes and dead-strips the `#[no_mangle]` `hwr_*` C-ABI
# exports of a `staticlib` built TOGETHER with the manifest's other crate types
# (`["staticlib", "cdylib", "rlib"]`, i.e. plain `cargo build`). The iOS
# xcframework is the only staticlib consumer (Pulley, no-JIT); built that way it
# ships with ZERO callable symbols (not even hwr_self_test). The cdylib
# platforms (macOS/Linux/Windows/Android) are unaffected: a cdylib carries an
# explicit export list a `.a` does not.
#
# Measured on aarch64-apple-ios, `--release --no-default-features --features
# "wasi-http typed-hosts"`, counting `nm -gU … | grep ' _hwr_'`:
#
#                    cargo build (3 crate types)   cargo rustc --crate-type staticlib
#   1.93.1 / 1.94.0  26-30 exports  OK
#   1.95.0           0 exports      BROKEN         30 exports  OK (same symbol set)
#   1.96.0           0 exports      BROKEN
#
# So scripts/build-release.sh builds the iOS slices with `cargo rustc --lib
# --crate-type staticlib` and fails the release if the required hwr_* symbols
# are missing from the .a. Neither `strip` nor a `#[used]` keep-alive fixes the
# 3-crate-type build (the symbol is internalized before strip; #[used] keeps the
# code but not the external name); `lto = false` works but emits LLVM-bitcode
# objects Apple's linker can't read.
#
# Before bumping: run scripts/build-release.sh on a Mac (or build_nojit's
# command for aarch64-apple-ios) and confirm `nm` lists hwr_self_test + the
# hwr_p3s_start_*_precompiled exports in the resulting libhellohq_wasm_runtime.a.
[toolchain]
channel = "1.95.0"
profile = "minimal"
# rustfmt + clippy for the CI lint job (rustup won't auto-install components the
# way it auto-installs toolchains/targets named here). Targets are added by the
# per-runner `rustup target add` steps, which resolve to this pinned toolchain.
components = ["rustfmt", "clippy"]
