# Pinned Rust toolchain. DO NOT bump without re-verifying the iOS slice.
#
# WHY PINNED: rustc regressed fat-LTO (`[profile.release] lto = true`) symbol
# export for `staticlib` crates — it internalizes and dead-strips the
# `#[no_mangle]` `hwr_*` C-ABI exports. The iOS xcframework is the only
# staticlib consumer (Pulley, no-JIT); on a bad toolchain it ships with ZERO
# callable symbols (not even hwr_self_test), while the cdylib platforms
# (macOS/Linux/Windows/Android) are unaffected because a cdylib carries an
# explicit export list a `.a` does not.
#
# Measured on aarch64-apple-ios with the build command below, counting
# `nm -gU … | grep ' _hwr_'`:
#
#   1.93.1  26 exports  OK
#   1.94.0  26 exports  OK   <- pinned here
#   1.95.0   0 exports  BROKEN
#   1.96.0   0 exports  BROKEN
#
# So the regression lands in 1.95, not 1.96 as this comment previously said —
# 1.95 was simply never tested when the pin went in. 1.94.0 is therefore the
# newest usable toolchain, and it is exactly the MSRV wasmtime 46 /
# cranelift-assembler-x64 0.133 require, which is what this bump unblocks.
#
# Neither `strip` nor a `#[used]` keep-alive fixes a bad toolchain (the symbol
# is internalized before strip; #[used] keeps the code but not the external
# name); `lto = false` works but emits LLVM-bitcode objects Apple's linker
# can't read. So we pin instead.
#
# Before bumping: build `--no-default-features --features wasi-http --target
# aarch64-apple-ios` and confirm `nm` lists hwr_self_test + the
# hwr_p3s_start_*_precompiled exports in the resulting libhellohq_wasm_runtime.a.
[toolchain]
channel = "1.94.0"
profile = "minimal"
# rustfmt + clippy for the CI lint job (rustup won't auto-install components the
# way it auto-installs toolchains/targets named here). Targets are added by the
# per-runner `rustup target add` steps, which resolve to this pinned toolchain.
components = ["rustfmt", "clippy"]
